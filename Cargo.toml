[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Floor set by keyring 4, proptest 1.12 and time 0.3.55 (all 1.88); 1.89 adds
# headroom and is what the msrv CI job tests.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Esl1h/ndac"
homepage = "https://github.com/Esl1h/ndac"
authors = ["Esli Silva"]
keywords = ["nextdns", "dns", "gitops", "infrastructure-as-code", "cli"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
ndac-api = { path = "crates/ndac-api", version = "0.0.0" }
ndac-core = { path = "crates/ndac-core", version = "0.0.0", default-features = false }
ndac-testkit = { path = "crates/ndac-testkit" }

assert_cmd = "2.2.2"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dotenvy = "0.15.7"
fastrand = "2.5.0"
globset = { version = "0.4.20", default-features = false }
idna = "1.1.0"
keyring = "4.2.0"
miette = "7.6.0"
nix = { version = "0.31.3", default-features = false }
httpdate = "1.0.3"
# rustls with ring instead of reqwest's default aws-lc-rs: a lighter C build
# for musl and aarch64 cross targets, and no MIT-0 code from aws-lc-sys.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "http2",
] }
predicates = "3.1.4"
proptest = "1.12.0"
insta = "1.49.0"
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", default-features = false }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "json",
  "std",
] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
