name: Feature request
description: Suggest a new capability or a change in behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Commands, configuration or output you would like to see.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: api
    attributes:
      label: NextDNS API
      options:
        - label: This relies only on documented NextDNS API endpoints
