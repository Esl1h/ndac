version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base image digest of packaging/container/Dockerfile. Dependabot does
  # not look inside workflow `docker run` lines (packaging.yml), so that
  # digest is updated by hand.
  - package-ecosystem: docker
    directory: /packaging/container
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
