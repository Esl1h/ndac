name: Packaging

# After a release is published: updates the AUR package ndac-bin and starts
# the Fedora COPR build. Each job is optional and only runs when its
# repository variable is "true" (AUR_ENABLED, COPR_ENABLED); see
# docs/src/maintainers.md for the secrets they need.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, e.g. v0.1.0
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  aur:
    name: AUR ndac-bin
    if: vars.AUR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Fill in version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --pattern SHA256SUMS --dir release
          sum() { awk -v f="ndac-$version-$1-unknown-linux-musl.tar.gz" '$2 == f { print $1 }' release/SHA256SUMS; }
          x86=$(sum x86_64)
          arm=$(sum aarch64)
          test -n "$x86" && test -n "$arm"
          mkdir -p aur
          sed -e "s/^pkgver=.*/pkgver=$version/" \
              -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x86')/" \
              -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm')/" \
              packaging/aur/PKGBUILD >aur/PKGBUILD
          # makepkg refuses to run as root, and .SRCINFO must come from it.
          docker run --rm --user nobody -v "$PWD/aur:/pkg:ro" -w /pkg \
            -e BUILDDIR=/tmp -e PKGDEST=/tmp -e SRCDEST=/tmp -e SRCPKGDEST=/tmp -e LOGDEST=/tmp \
            docker.io/library/archlinux:base-devel@sha256:0ccc8b2e55c0c26a6e501e892cc6b1cdea7cfdf77e432941320148b4dabd2bff \
            makepkg --printsrcinfo >aur/.SRCINFO
          cat aur/.SRCINFO
      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GIT_AUTHOR_NAME: ${{ vars.AUR_GIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.AUR_GIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.AUR_GIT_EMAIL }}
        run: |
          test -n "$GIT_AUTHOR_NAME" && test -n "$GIT_AUTHOR_EMAIL"
          install -d -m 0700 ~/.ssh
          # Host key checked against the fingerprint Arch Linux publishes:
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur)
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/ndac-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already at $TAG"
          else
            git commit -m "Update to ${TAG#v}"
            git push origin HEAD:master
          fi
          rm -f ~/.ssh/aur

  copr:
    name: Fedora COPR
    if: vars.COPR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Trigger the COPR build
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          # The custom webhook builds the package with .copr/Makefile, which
          # picks up the latest release tag.
          curl -fsS -X POST "$COPR_WEBHOOK_URL" -o /dev/null -w '%{http_code}\n'
