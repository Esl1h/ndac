include = ["**/*.toml"]
# examples/ follows `ndac fmt`, which aligns `=`; fuzz seeds are not
# always valid TOML.
exclude = ["target/**", "fuzz/target/**", "fuzz/seeds/**", "examples/**"]

[formatting]
indent_string = "  "
align_entries = false
array_auto_collapse = false
reorder_keys = false
column_width = 100
