[package]
name = "ndac-core"
description = "Configuration model, diff engine and planner for ndac"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["keyring"]
# OS keyring source (Secret Service on Linux, Keychain on macOS).
keyring = ["dep:keyring"]
# `age:` source: decrypts with the `age` binary, so plugins such as
# age-plugin-yubikey work.
age = []

[dependencies]
dotenvy.workspace = true
globset.workspace = true
idna.workspace = true
keyring = { workspace = true, optional = true }
miette.workspace = true
ndac-api.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
insta.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
