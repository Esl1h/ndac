[package]
name = "ndac"
description = "NextDNS-as-Code: manage NextDNS profiles declaratively from TOML files"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ndac"
path = "src/main.rs"

[features]
default = ["keyring"]
keyring = ["ndac-core/keyring"]
age = ["ndac-core/age"]

[dependencies]
clap.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
ndac-api.workspace = true
ndac-core = { workspace = true, default-features = false }
rpassword.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
assert_cmd.workspace = true
ndac-testkit.workspace = true
predicates.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
