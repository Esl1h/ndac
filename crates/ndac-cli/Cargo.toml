[package]
name = "ndac"
description = "NextDNS-as-Code: manage NextDNS profiles declaratively from TOML files"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ndac"
path = "src/main.rs"

[features]
default = ["keyring"]
keyring = ["ndac-core/keyring"]
age = ["ndac-core/age"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
miette = { workspace = true, features = ["fancy-no-backtrace"] }
ndac-api.workspace = true
ndac-core = { workspace = true, default-features = false }
rpassword.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
assert_cmd.workspace = true
ndac-testkit.workspace = true
predicates.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Linux packages, built by release.yml from the static musl binary with
# completions and the man page generated into target/assets
# (packaging/scripts/assets.sh). The systemd units are installed but not
# enabled.
[package.metadata.deb]
section = "net"
priority = "optional"
extended-description = """\
Keeps the desired state of NextDNS profiles in TOML files, shows the \
difference with the live state as a plan, and applies it."""
assets = [
  [
    "target/release/ndac",
    "usr/bin/",
    "755",
  ],
  [
    "../../target/assets/completions/ndac.bash",
    "usr/share/bash-completion/completions/ndac",
    "644",
  ],
  [
    "../../target/assets/completions/_ndac",
    "usr/share/zsh/vendor-completions/",
    "644",
  ],
  [
    "../../target/assets/completions/ndac.fish",
    "usr/share/fish/vendor_completions.d/",
    "644",
  ],
  [
    "../../target/assets/man/ndac.1",
    "usr/share/man/man1/",
    "644",
  ],
  [
    "../../packaging/systemd/ndac-drift.service",
    "usr/lib/systemd/system/",
    "644",
  ],
  [
    "../../packaging/systemd/ndac-drift.timer",
    "usr/lib/systemd/system/",
    "644",
  ],
  [
    "../../README.md",
    "usr/share/doc/ndac/",
    "644",
  ],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/ndac", dest = "/usr/bin/ndac", mode = "755" },
  { source = "../../target/assets/completions/ndac.bash", dest = "/usr/share/bash-completion/completions/ndac", mode = "644" },
  { source = "../../target/assets/completions/_ndac", dest = "/usr/share/zsh/site-functions/_ndac", mode = "644" },
  { source = "../../target/assets/completions/ndac.fish", dest = "/usr/share/fish/vendor_completions.d/ndac.fish", mode = "644" },
  { source = "../../target/assets/man/ndac.1", dest = "/usr/share/man/man1/ndac.1", mode = "644", doc = true },
  { source = "../../packaging/systemd/ndac-drift.service", dest = "/usr/lib/systemd/system/ndac-drift.service", mode = "644" },
  { source = "../../packaging/systemd/ndac-drift.timer", dest = "/usr/lib/systemd/system/ndac-drift.timer", mode = "644" },
  { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/ndac/LICENSE-MIT", mode = "644", doc = true },
  { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/ndac/LICENSE-APACHE", mode = "644", doc = true },
  { source = "../../README.md", dest = "/usr/share/doc/ndac/README.md", mode = "644", doc = true },
]
