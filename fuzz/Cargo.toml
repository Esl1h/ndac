# cargo-fuzz targets, run with `just fuzz` (nightly). Not a member of the
# main workspace, so stable builds never see libfuzzer-sys.
[package]
name = "ndac-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ndac-api = { path = "../crates/ndac-api" }
ndac-core = { path = "../crates/ndac-core", default-features = false }
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_profile"
path = "fuzz_targets/api_profile.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
