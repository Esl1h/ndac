# release-plz: release PRs, version bumps, CHANGELOG.md, tags and crates.io
# publishing. https://release-plz.dev/docs/config

[workspace]
# Release only when a release PR is merged, not on every push to main.
release_always = false
# release.yml builds the binaries from the tag, uploads them and publishes
# the GitHub release; release-plz only prepares it as a draft.
git_release_draft = true
# One changelog for the whole project (see the ndac package below): users
# follow the binary, and the library crates move in lockstep with it.
changelog_update = false

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and the project adheres to [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { message = "^revert", group = "<!-- 6 -->Reverted" },
  { message = "^(build|chore|ci|style|test)", skip = true },
]

[[package]]
name = "ndac"
version_group = "ndac"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["ndac-api", "ndac-core"]
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[[package]]
name = "ndac-core"
version_group = "ndac"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "ndac-api"
version_group = "ndac"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "ndac-testkit"
release = false
