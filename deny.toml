# cargo-deny policy. Advisories come from the RustSec database, so this also
# replaces a separate `cargo audit` run.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound advisories are denied by default.
yanked = "deny"
# Transitive unmaintained crates are often out of our control; direct ones
# are not.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Weak, file-level copyleft: compatible with distributing a binary under
  # MIT/Apache-2.0 as long as MPL files stay unmodified or their source is
  # offered.
  "MPL-2.0",
]
exceptions = [
  # Mozilla's root certificate data, used by rustls-platform-verifier as a
  # fallback trust store. A permissive license for data, not code.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version requirement.
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "openssl", reason = "TLS must use rustls" },
  { crate = "openssl-sys", reason = "TLS must use rustls" },
  { crate = "native-tls", reason = "TLS must use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
