[files]
extend-exclude = [
  "LICENSE-*",
  "**/tests/fixtures/**",
  "**/tests/snapshots/**",
  "schema/*.json",
]

[default]
# NextDNS profile IDs are short random alphanumerics.
extend-ignore-re = ['''\b[0-9a-f]{6}\b''']

# Deliberate misspellings that exercise "did you mean" suggestions.
[default.extend-words]
bse = "bse"
privcy = "privcy"
# Prompt shortcuts such as "[i]mport" and "[o]verwrite".
mport = "mport"
